[package]
name = "telestra"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A native GTK4 Telegram client for Linux"
license = "GPL-3.0-or-later"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2" }
gtk = { package = "gtk4", version = "0.11" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
