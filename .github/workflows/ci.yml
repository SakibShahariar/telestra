name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check TDLib packaging script syntax
        run: bash -n scripts/verify-tdlib-source.sh

      - name: Install native development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libadwaita-1-dev pkg-config xvfb dbus-daemon xdotool

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Smoke test GTK application startup
        run: |
          xvfb-run -a dbus-run-session -- bash -euo pipefail -c '
            cargo run --locked > /tmp/telestra-smoke.log 2>&1 &
            app_pid=$!
            cleanup() {
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            for _ in $(seq 1 20); do
              if xdotool search --onlyvisible --name "^Telestra$" >/dev/null 2>&1; then
                echo "Telestra window appeared."
                exit 0
              fi
              if ! kill -0 "$app_pid" 2>/dev/null; then
                cat /tmp/telestra-smoke.log
                exit 1
              fi
              sleep 1
            done
            cat /tmp/telestra-smoke.log
            echo "Telestra window did not appear."
            exit 1
          '

