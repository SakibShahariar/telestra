name: TDLib native build

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-tdlib.sh"
      - "scripts/verify-tdlib-source.sh"
      - "packaging/tdlib/**"
      - ".github/workflows/tdlib.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/tdlib-ffi/**"
      - "crates/tdlib-ffi/tests/tdlib_native_smoke.rs"
  pull_request:
    paths:
      - "scripts/build-tdlib.sh"
      - "scripts/verify-tdlib-source.sh"
      - "packaging/tdlib/**"
      - ".github/workflows/tdlib.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build pinned TDLib JSON runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Telestra
        uses: actions/checkout@v4

      - name: Install TDLib build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential binutils cmake git gperf libssl-dev zlib1g-dev

      - name: Build and verify TDLib
        run: scripts/build-tdlib.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Exercise the native TDLib API through Rust FFI
        run: |
          library="$(find target/tdlib/lib -type f -name 'libtdjson.so*' -print -quit)"
          test -n "$library"
          TELESTRA_TDLIB_LIBRARY="$library" cargo test --manifest-path crates/tdlib-ffi/Cargo.toml --test tdlib_native_smoke
